-->
<style>
  /* ---------- fichas ---------- */
  :root {

    }
  }
  :root[data-theme="dark"] {

  .porque {

  .link-porque {
    background: none; border: 0; padding: 0;

  .acciones { display: flex; gap: .4rem; flex-wrap: wrap; }

    border: 1px solid var(--hair);

  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ground); font-weight: 600; }
  .btn.big { padding: .8rem 1rem; font-size: .95rem; flex: 1; }
  .btn[aria-pressed="true"] { background: var(--accent-w); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .nota {
    width: 100%; font: inherit; font-size: .85rem;

  .diario-eco {

  .silencio { font-size: .85rem; color: var(--muted); }

  /* supresión propuesta */
  .card.suprimir { border-style: dashed; border-color: var(--muted); }

  .card.resuelto-quitar { opacity: .55; }

    font-size: .84rem;

  /* --- variante A: ficha por planta --- */
  .a-plant + .a-plant { margin-top: 0; }

  /* --- variante B: por acción --- */
  .grupo { display: flex; flex-direction: column; gap: .5rem; }
  .grupo-head {

  .fila[data-hecho="1"] .tick { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .fila[data-hecho="1"] .fila-txt { color: var(--muted); text-decoration: line-through; }

  details.plegado > summary::before { content: "▸"; font-size: .7rem; }

  details.plegado > div { padding-top: .6rem; display: flex; flex-direction: column; gap: .45rem; }

  /* --- variante C: una cosa a la vez --- */
  .c-wrap { display: flex; flex-direction: column; gap: 1rem; min-height: 60vh; }
  .progreso { display: flex; align-items: center; gap: .5rem; }

  .c-card {

  /* --- conmutador flotante (no forma parte del diseño evaluado) --- */
  #switcher {
    position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);

  }
  #switcher .row {
    display: flex; align-items: stretch; gap: 1px;
    background: #14170F; color: #F6F7F2;
    border-radius: 999px; padding: .25rem;
    box-shadow: 0 6px 24px rgba(0,0,0,.32);
    font-family: var(--mono); font-size: .74rem;
  }
  #switcher button {
    background: none; border: 0; color: inherit;
    padding: .35rem .7rem; border-radius: 999px;

  #switcher .label { padding: .35rem .55rem; white-space: nowrap; align-self: center; }
  #switcher .seg button[aria-current="true"] { background: #F6F7F2; color: #14170F; font-weight: 700; }
  #switcher .hint { font-family: var(--mono); font-size: .62rem; color: var(--muted); }
</style>

  <div class="row">
    <button id="prev" aria-label="Variante anterior">←</button>

<script>
/* ============================================================
   DATOS — las 4 plantas reales, semana del 10-ago-2026
   ============================================================ */

const PLANTAS = {
  olivo: { nombre: "Olivo",  latin: "Olea europaea", sitio: "Jardín este · suelo" },
  abeto: { nombre: "Abeto",  latin: null,            sitio: "Jardín noroeste, centro · suelo" },
  rosal: { nombre: "Rosal",  latin: "Rosa",          sitio: "Fachada noroeste, bajo alero · suelo" },
  aloe:  { nombre: "Aloe",   latin: "Aloe vera",     sitio: "Terraza suroeste · maceta 7,5 L" },
};

const SEMANAS = {
  llena: {
    titulo: "Semana del 10 de agosto",
    edad: "Generado el lunes, hace 4 días",
    stale: false,
    alertas: [{
      ambito: "Toda la casa",
      titulo: "Aviso amarillo por temperaturas máximas",
      texto: "Se esperan 37 °C o más de martes a jueves. El aloe de la terraza suroeste da al sol de tarde.",
      fuente: "AEMET · zona 681903 Alcarria de Guadalajara · vigente hasta el jue 21:00",
    }],
    items: [
      {
        id: "aloe-riego",
        planta: "aloe", verbo: "water", accion: "Riega el aloe a fondo",
        corto: "Riégalo a fondo",
        razon: "El depósito de la maceta bajó al 22 % el miércoles. Con las máximas previstas se vacía antes del domingo.",
        hechos: ["ks Aloe · WUCOLS (género)", "ET0 · Open-Meteo 10–16 ago"],
        respuestas: ["Hecho", "Le eché poco", "No"],
        pregunta: false,
      },
      {
        id: "aloe-hijuelos",
        planta: "aloe", verbo: "divide", accion: "¿Tiene hijuelos de más de un palmo?",
        corto: "Mira si tiene hijuelos",
        razon: "Si los hay, se separan ahora y no en octubre. No lo sé desde aquí: hay que mirarlo.",
        hechos: ["Separación de hijuelos · IVIA (género)"],
        respuestas: ["Sí, los tiene", "No", "No lo he mirado"],
        pregunta: true,
      },
      {
        id: "abeto-id",
        planta: "abeto", verbo: "identify", accion: "El abeto sigue sin identificar",
        corto: "Hazle una foto",
        razon: "Sin nombre no tengo su temperatura mínima, así que en enero no sabré si avisarte de la helada.",
        hechos: ["Sin taxón", "Rusticidad ausente"],
        respuestas: ["Hacer foto", "Ahora no"],
        pregunta: false,
      },
    ],
    supresiones: [{
      id: "rosal-riego",
      planta: "rosal", verbo: "water", accion: "Riega el rosal",
      llm: "Lo propuse por el balance: está bajo alero y no le llegó la lluvia del día 8. Pero su coeficiente está sin determinar entre 0,10 y 0,60, y por el extremo bajo aún le quedan tres semanas. Yo lo quitaría. Si lo ves mustio, déjalo y me habré equivocado.",
      hechos: ["KL Rosa · 0,10–0,60 (género)", "Lluvia 8 ago · no interceptada"],
    }],
    reconciliacion: {
      id: "aloe-silencio",
      planta: "aloe",
      texto: "El aloe lleva 11 días sin ninguna nota y sueles tocarlo cada 5.",
      respuestas: ["Lo regué y no lo apunté", "Está seco", "Está húmedo"],
    },
    silencio: [
      { planta: "olivo", linea: "Nada. Le quedan unos tres meses de autonomía y llovió el día 8." },
      { planta: "rosal", linea: "Nada, si aceptas quitar el riego de arriba." },
      { planta: "abeto", linea: "Nada más hasta que sepa qué es." },
    ],
  },

  vacia: {
    titulo: "Semana del 3 de agosto",
    edad: "Generado el lunes, hace 2 días",
    stale: false,
    alertas: [],
    items: [],
    supresiones: [],
    reconciliacion: null,
    silencio: [
      { planta: "olivo", linea: "Nada. Le quedan unos tres meses de autonomía." },
      { planta: "abeto", linea: "Nada. Sigue sin identificar; hasta entonces no puedo decir gran cosa." },
      { planta: "rosal", linea: "Nada. Bajo alero, pero por el balance aún le queda margen." },
      { planta: "aloe",  linea: "Nada. Lo regaste el jueves pasado y el depósito va por el 68 %." },
    ],
  },
};

/* ============================================================
   ESTADO EN MEMORIA — sin persistencia, a propósito
   ============================================================ */

let estado = {};
function resetEstado() { estado = { respuestas: {}, notas: {}, supresiones: {}, abiertos: {}, cursor: 0 }; }
resetEstado();

/* ============================================================
   HELPERS
   ============================================================ */

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
};

function nombrePlanta(key) {
  const p = PLANTAS[key];
  return p.latin
    ? el("span", {}, p.nombre + " ", el("span", { class: "latin" }, p.latin))
    : el("span", {}, p.nombre + " ", el("span", { class: "eyebrow" }, "sin identificar"));
}

function ecoDiario(id) {
  const r = estado.respuestas[id];
  if (!r) return null;
  return el("div", { class: "diario-eco" }, "→ anotado en el diario: " + r.toLowerCase());
}

function cabecera(sem) {
  return el("header", { class: "plan-head" },
    el("span", { class: "eyebrow" }, "Plan semanal"),
    el("h1", {}, sem.titulo),
    el("span", { class: "age" + (sem.stale ? " stale" : "") }, sem.edad),
  );
}

function bloqueAlerta(a) {
  return el("div", { class: "alerta" },
    el("span", { class: "eyebrow" }, "Aviso · " + a.ambito),
    el("strong", {}, a.titulo),
    el("p", {}, a.texto),
    el("span", { class: "fuente" }, a.fuente),
  );
}

function porque(item, { siempre = false } = {}) {
  const abierto = siempre || estado.abiertos[item.id];
  if (!abierto) {
    return el("button", {
      class: "link-porque",
      onclick: () => { estado.abiertos[item.id] = true; render(); },
    }, "¿Por qué?");
  }
  return el("div", { class: "porque" },
    el("span", {}, item.razon),
    el("div", { class: "hechos" }, item.hechos.map((h) => el("span", { class: "hecho" }, h))),
  );
}

function botonera(item) {
  return el("div", { class: "acciones" }, item.respuestas.map((r, i) =>
    el("button", {
      class: "btn" + (i === 0 && !estado.respuestas[item.id] ? " primary" : ""),
      "aria-pressed": estado.respuestas[item.id] === r ? "true" : "false",
      onclick: () => {
        estado.respuestas[item.id] = estado.respuestas[item.id] === r ? undefined : r;
        render();
      },
    }, r),
  ));
}

function cajonNota(item) {
  if (!estado.respuestas[item.id]) return null;
  return el("textarea", {
    class: "nota",
    placeholder: "Añade lo que quieras (opcional)…",
    oninput: (e) => { estado.notas[item.id] = e.target.value; },
  }, estado.notas[item.id] || "");
}

function tarjetaSupresion(s) {
  const decision = estado.supresiones[s.id];
  return el("div", { class: "card suprimir" + (decision === "quitar" ? " resuelto-quitar" : "") },
    el("div", { class: "body" },
      el("span", { class: "eyebrow" }, "Propongo quitar esto"),
      el("div", {},
        el("span", { class: "plant-name" }, s.accion),
        el("div", { class: "site" }, PLANTAS[s.planta].sitio),
      ),
      el("div", { class: "llm-dice" },
        el("span", { class: "quien" }, "Por qué lo quitaría"),
        s.llm,
      ),
      el("div", { class: "hechos" }, s.hechos.map((h) => el("span", { class: "hecho" }, h))),
      el("div", { class: "acciones" },
        el("button", {
          class: "btn", "aria-pressed": decision === "quitar" ? "true" : "false",
          onclick: () => { estado.supresiones[s.id] = "quitar"; render(); },
        }, "Quítalo"),
        el("button", {
          class: "btn", "aria-pressed": decision === "dejar" ? "true" : "false",
          onclick: () => { estado.supresiones[s.id] = "dejar"; render(); },
        }, "Déjalo, lo haré"),
      ),
    ),
  );
}

function tarjetaReconciliacion(r) {
  return el("div", { class: "card" },
    el("div", { class: "body" },
      el("span", { class: "eyebrow" }, "No sé en qué punto está"),
      el("div", {}, r.texto),
      el("div", { class: "acciones" }, r.respuestas.map((t) =>
        el("button", {
          class: "btn",
          "aria-pressed": estado.respuestas[r.id] === t ? "true" : "false",
          onclick: () => { estado.respuestas[r.id] = t; render(); },
        }, t),
      )),
      ecoDiario(r.id),
    ),
  );
}

function barraAceptar(sem) {
  const pend = sem.supresiones.filter((s) => !estado.supresiones[s.id]).length;
  if (!sem.supresiones.length) return null;
  return el("div", { class: "aceptar-cambios" },
    el("span", {}, pend ? `Queda ${pend} cambio por contestar` : "Todo contestado"),
    el("button", { class: "btn primary", disabled: pend > 0 }, "Aceptar cambios"),
  );
}

/* ============================================================
   VARIANTE A — una ficha por planta, siempre las cuatro
   ============================================================ */

function VarianteA(sem) {
  const orden = ["aloe", "abeto", "rosal", "olivo"];
  const porPlanta = Object.fromEntries(orden.map((k) => [k, []]));
  sem.items.forEach((i) => porPlanta[i.planta].push(i));
  const supPorPlanta = Object.fromEntries(orden.map((k) => [k, []]));
  sem.supresiones.forEach((s) => supPorPlanta[s.planta].push(s));
  const silPorPlanta = Object.fromEntries(sem.silencio.map((s) => [s.planta, s.linea]));

  return el("div", { style: "display:flex;flex-direction:column;gap:1rem" },
    cabecera(sem),
    sem.alertas.map(bloqueAlerta),
    orden.map((k) => {
      const items = porPlanta[k];
      const sups = supPorPlanta[k];
      const n = items.length;
      const quiet = n === 0 && sups.length === 0;
      return el("div", { class: "card a-plant" + (quiet ? " quiet" : "") },
        el("div", { class: "a-head" },
          el("div", {},
            el("div", { class: "plant-name" }, nombrePlanta(k)),
            el("div", { class: "site" }, PLANTAS[k].sitio),
          ),
          el("span", { class: "conteo" }, quiet ? "—" : `${n + sups.length} cosa${n + sups.length > 1 ? "s" : ""}`),
        ),
        el("div", { class: "body" },
          quiet
            ? el("div", { class: "silencio" }, silPorPlanta[k] || "Nada esta semana.")
            : [
                items.map((item) => el("div", { style: "display:flex;flex-direction:column;gap:.5rem" },
                  el("div", { style: "font-size:.95rem" }, item.accion),
                  porque(item),
                  botonera(item),
                  cajonNota(item),
                  ecoDiario(item.id),
                )),
                sups.map((s) => el("div", { class: "llm-dice", style: "margin-top:.2rem" },
                  el("span", { class: "quien" }, "Propongo quitar: " + s.accion),
                  s.llm,
                  el("div", { class: "acciones", style: "margin-top:.5rem" },
                    el("button", {
                      class: "btn", "aria-pressed": estado.supresiones[s.id] === "quitar" ? "true" : "false",
                      onclick: () => { estado.supresiones[s.id] = "quitar"; render(); },
                    }, "Quítalo"),
                    el("button", {
                      class: "btn", "aria-pressed": estado.supresiones[s.id] === "dejar" ? "true" : "false",
                      onclick: () => { estado.supresiones[s.id] = "dejar"; render(); },
                    }, "Déjalo"),
                  ),
                )),
              ],
        ),
      );
    }),
    sem.reconciliacion && tarjetaReconciliacion(sem.reconciliacion),
    barraAceptar(sem),
  );
}

/* ============================================================
   VARIANTE B — agrupado por acción, silencio plegado al pie
   ============================================================ */

const VERBOS = {
  water:    "Riega",
  divide:   "Mira y contéstame",
  identify: "Ficha de la planta",
};

function VarianteB(sem) {
  const grupos = {};
  sem.items.forEach((i) => (grupos[i.verbo] ||= []).push(i));

  return el("div", { style: "display:flex;flex-direction:column;gap:1.1rem" },
    cabecera(sem),
    sem.alertas.map(bloqueAlerta),

    sem.items.length === 0 && sem.supresiones.length === 0
      ? el("div", { class: "card" }, el("div", { class: "body" },
          el("div", { class: "plant-name" }, "Nada que hacer"),
          el("div", { class: "silencio" }, "Las cuatro plantas están servidas esta semana."),
        ))
      : null,

    Object.entries(grupos).map(([verbo, items]) =>
      el("div", { class: "grupo" },
        el("div", { class: "grupo-head" }, `${VERBOS[verbo] || verbo} · ${items.length}`),
        items.map((item) => {
          const hecho = estado.respuestas[item.id] ? "1" : "0";
          return el("div", { class: "fila", "data-hecho": hecho },
            el("button", {
              class: "tick", "aria-label": "Marcar hecho",
              onclick: () => {
                estado.respuestas[item.id] = estado.respuestas[item.id] ? undefined : item.respuestas[0];
                render();
              },
            }, "✓"),
            el("div", { class: "fila-txt" },
              item.corto,
              el("small", {}, nombrePlanta(item.planta)),
              estado.abiertos[item.id]
                ? el("div", { style: "margin-top:.5rem" }, porque(item, { siempre: true }))
                : el("button", {
                    class: "link-porque", style: "margin-top:.35rem",
                    onclick: () => { estado.abiertos[item.id] = true; render(); },
                  }, "¿Por qué?"),
              estado.respuestas[item.id] ? el("div", { style: "margin-top:.5rem" }, cajonNota(item)) : null,
            ),
          );
        }),
      ),
    ),

    sem.supresiones.length
      ? el("div", { class: "grupo" },
          el("div", { class: "grupo-head" }, `Propongo quitar · ${sem.supresiones.length}`),
          sem.supresiones.map(tarjetaSupresion),
        )
      : null,

    sem.reconciliacion && tarjetaReconciliacion(sem.reconciliacion),

    el("details", { class: "plegado" },
      el("summary", {}, `${sem.silencio.length} planta${sem.silencio.length > 1 ? "s" : ""} sin nada que hacer`),
      el("div", {}, sem.silencio.map((s) =>
        el("div", { class: "silencio" },
          el("strong", { style: "font-weight:600;color:var(--ink)" }, nombrePlanta(s.planta)),
          " — " + s.linea,
        ),
      )),
    ),

    barraAceptar(sem),
  );
}

/* ============================================================
   VARIANTE C — una cosa a la vez, en cola
   ============================================================ */

function VarianteC(sem) {
  const cola = [
    ...sem.alertas.map((a) => ({ tipo: "alerta", data: a })),
    ...(sem.reconciliacion ? [{ tipo: "recon", data: sem.reconciliacion }] : []),
    ...sem.items.map((i) => ({ tipo: "item", data: i })),
    ...sem.supresiones.map((s) => ({ tipo: "sup", data: s })),
  ];
  const total = cola.length;
  const i = Math.min(estado.cursor, total);
  const enCierre = i >= total;

  const avanzar = () => { estado.cursor = Math.min(estado.cursor + 1, total); render(); };
  const retroceder = () => { estado.cursor = Math.max(estado.cursor - 1, 0); render(); };

  const progreso = el("div", { class: "progreso" },
    el("span", { class: "num", style: "font-size:.72rem;color:var(--muted)" },
      enCierre ? "fin" : `${i + 1}/${total}`),
    el("div", { class: "barras" }, cola.map((_, k) =>
      el("i", { class: k < i ? "done" : k === i ? "now" : "" }))),
  );

  let cuerpo;
  if (enCierre) {
    cuerpo = el("div", { class: "c-card c-cierre" },
      el("span", { class: "eyebrow" }, total ? "Has llegado al final" : "Esta semana no hay nada"),
      el("div", { class: "c-verbo" }, total ? "Ya está." : "Nada que hacer."),
      el("div", { class: "silencio" }, "Y de las demás, esto es lo que sé:"),
      ...sem.silencio.map((s) => el("div", { class: "silencio" },
        el("strong", { style: "font-weight:600;color:var(--ink)" }, nombrePlanta(s.planta)),
        " — " + s.linea,
      )),
      total ? el("button", { class: "btn", style: "align-self:flex-start", onclick: retroceder }, "← Volver atrás") : null,
    );
  } else {
    const paso = cola[i];
    if (paso.tipo === "alerta") {
      const a = paso.data;
      cuerpo = el("div", { class: "c-card aviso" },
        el("span", { class: "eyebrow", style: "color:var(--warn)" }, "Aviso · " + a.ambito),
        el("div", { class: "c-verbo" }, a.titulo),
        el("div", { class: "c-razon" }, a.texto),
        el("span", { class: "fuente" }, a.fuente),
        el("div", { class: "c-nav", style: "margin-top:auto" },
          el("button", { class: "btn big primary", onclick: avanzar }, "Entendido"),
        ),
      );
    } else if (paso.tipo === "recon") {
      const r = paso.data;
      cuerpo = el("div", { class: "c-card" },
        el("span", { class: "eyebrow" }, "No sé en qué punto está"),
        el("div", { class: "c-verbo" }, "¿Cómo está el aloe?"),
        el("div", { class: "c-razon" }, r.texto),
        el("div", { style: "display:flex;flex-direction:column;gap:.4rem;margin-top:auto" },
          ...r.respuestas.map((t) => el("button", {
            class: "btn big", "aria-pressed": estado.respuestas[r.id] === t ? "true" : "false",
            onclick: () => { estado.respuestas[r.id] = t; avanzar(); },
          }, t)),
        ),
      );
    } else if (paso.tipo === "sup") {
      const s = paso.data;
      cuerpo = el("div", { class: "c-card" },
        el("span", { class: "eyebrow" }, "Propongo quitar esto"),
        el("div", { class: "c-verbo", style: "text-decoration:line-through;text-decoration-color:var(--muted)" }, s.accion),
        el("div", { class: "c-razon" }, s.llm),
        el("div", { class: "hechos" }, s.hechos.map((h) => el("span", { class: "hecho" }, h))),
        el("div", { class: "c-nav", style: "margin-top:auto" },
          el("button", { class: "btn big", onclick: () => { estado.supresiones[s.id] = "quitar"; avanzar(); } }, "Quítalo"),
          el("button", { class: "btn big", onclick: () => { estado.supresiones[s.id] = "dejar"; avanzar(); } }, "Déjalo"),
        ),
      );
    } else {
      const item = paso.data;
      cuerpo = el("div", { class: "c-card" },
        el("span", { class: "eyebrow" }, nombrePlanta(item.planta).textContent + " · " + PLANTAS[item.planta].sitio),
        el("div", { class: "c-verbo" }, item.accion),
        el("div", { class: "c-razon" }, item.razon),
        el("div", { class: "hechos" }, item.hechos.map((h) => el("span", { class: "hecho" }, h))),
        el("textarea", {
          class: "nota",
          placeholder: "¿Algo que contar de esta planta?",
          oninput: (e) => { estado.notas[item.id] = e.target.value; },
        }, estado.notas[item.id] || ""),
        el("div", { style: "display:flex;flex-direction:column;gap:.4rem;margin-top:auto" },
          ...item.respuestas.map((t, k) => el("button", {
            class: "btn big" + (k === 0 ? " primary" : ""),
            onclick: () => { estado.respuestas[item.id] = t; avanzar(); },
          }, t)),
        ),
      );
    }
  }

  return el("div", { class: "c-wrap" },
    cabecera(sem),
    progreso,
    cuerpo,
    !enCierre && i > 0
      ? el("button", { class: "btn", style: "align-self:flex-start", onclick: retroceder }, "← Atrás")
      : null,
  );
}

/* ============================================================
   CONMUTADOR
   ============================================================ */

const VARIANTES = [
  ["A", "Ficha por planta", VarianteA],
  ["B", "Agrupado por acción", VarianteB],
  ["C", "Una cosa a la vez", VarianteC],
];

/* El estado del conmutador vive en memoria: el visor de Artifacts descarta el
   query string, así que la URL sola no basta. Se sigue escribiendo por si el
   fichero se abre suelto, pero nunca se lee como fuente de verdad. */
const inicial = new URLSearchParams(location.search);
const vIni = (inicial.get("variant") || "A").toUpperCase();
let actual = {
  v: ["A", "B", "C"].includes(vIni) ? vIni : "A",
  s: inicial.get("semana") === "vacia" ? "vacia" : "llena",
};

function params() { return actual; }

function ir(v, s) {
  actual = { v, s };
  try { history.replaceState(null, "", `?variant=${v}&semana=${s}`); } catch (_) { /* sandbox */ }
  resetEstado();
  render();
}

function render() {
  const { v, s } = params();
  const [, nombre, Comp] = VARIANTES.find(([k]) => k === v);
  const app = document.getElementById("app");
  app.replaceChildren(Comp(SEMANAS[s]));
  document.getElementById("vlabel").textContent = `${v} — ${nombre}`;
  document.querySelectorAll("#semana-seg button").forEach((b) => {
    b.setAttribute("aria-current", b.dataset.semana === s ? "true" : "false");
  });
}

function ciclar(paso) {
  const { v, s } = params();
  const idx = VARIANTES.findIndex(([k]) => k === v);
  ir(VARIANTES[(idx + paso + VARIANTES.length) % VARIANTES.length][0], s);
}

document.getElementById("prev").onclick = () => ciclar(-1);
document.getElementById("next").onclick = () => ciclar(1);
document.querySelectorAll("#semana-seg button").forEach((b) => {
  b.onclick = () => ir(params().v, b.dataset.semana);
});
addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") ciclar(-1);
  if (e.key === "ArrowRight") ciclar(1);
});

render();
</script>
